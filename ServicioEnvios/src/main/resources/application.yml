# --- Identidad del Servicio (Spring) ---
server:
  port: 8082

spring:
  application:
    name: servicio-envios

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://postgres:5432/tpi_db
    username: postgres
    password: 0852
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

  security:
    oauth2:
      client:
        registration:
          servicio-envios-client:
            provider: keycloak
            client-id: servicio-envios
            client-secret: ${SERVICIO_ENVIOS_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: "http://keycloak:8080/realms/transporte-realm"
      resourceserver:
        jwt:
          issuer-uri: "http://keycloak:8080/realms/transporte-realm"

servicio:
  tarifas:
    url: http://servicio-tarifa:8083
  cliente:
    url: http://servicio-cliente:8081
  flota:
    url: http://servicio-flota:8085

app:
  desvio-maximo-km: 100.0

osrm:
  base-url: ${OSRM_BASE_URL:http://localhost:5000}
  route-path: /route/v1/driving

logging:
  level:
    org.example.servicioenvios: DEBUG
    org.example.servicioenvios.feign: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: API de Servicio de Envíos (Orquestador)
    version: "1.0.0"
    description: "Microservicio central para la gestión y orquestación de envíos."